name: Android TV Experimental

on:
  push:
    branches:
      - experimental/android-tv
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Android TV branch
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Test TV policies and assemble APK
        run: >-
          ./gradlew
          :app:testStandardDebugUnitTest
          :app:assembleStandardDebug
          --stacktrace
          --no-daemon
          --max-workers=2

      - name: Upload standard debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: mpvRx-android-tv-${{ github.sha }}
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0