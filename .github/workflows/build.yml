name: CI/CD Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build universal APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APK_DIR: standard
      APK_BASE: app-standard-debug

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # BuildConfig.GIT_COUNT and preview build identities rely on the real repository history.
          fetch-depth: 0

      - name: Generate build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short HEAD)"
          echo "SHORT_SHA=$short_sha" >> "$GITHUB_ENV"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build universal debug APK
        shell: bash
        run: |
          set -euo pipefail
          # The Android Gradle plugin signs debug builds with its standard debug certificate.
          # This keeps CI builds installable without requiring a release keystore secret.
          ./gradlew assembleStandardDebug -PuniversalOnly=true --stacktrace --no-daemon --max-workers=2

      - name: Verify debug certificate
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          apk="app/build/outputs/apk/standard/debug/${APK_BASE}.apk"
          test -x "$apksigner"
          test -f "$apk"
          "$apksigner" verify --verbose "$apk"

      - name: Upload universal APK
        uses: actions/upload-artifact@v7
        with:
          name: app-standard-universal-debug-${{ steps.metadata.outputs.short_sha }}
          path: app/build/outputs/apk/standard/debug/app-standard-debug*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
