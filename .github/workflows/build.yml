name: CI/CD Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build universal APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APK_DIR: standard
      APK_BASE: app-standard-debug

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # BuildConfig.GIT_COUNT and preview build identities rely on the real repository history.
          fetch-depth: 0

      - name: Generate build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short HEAD)"
          echo "SHORT_SHA=$short_sha" >> "$GITHUB_ENV"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build universal debug APK
        shell: bash
        run: |
          set -euo pipefail
          # Debug builds are signed automatically by AGP with its standard debug certificate.
          ./gradlew assembleStandardDebug -PuniversalOnly=true --stacktrace --no-daemon --max-workers=2

      - name: Verify debug certificate
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          apk="app/build/outputs/apk/standard/debug/${APK_BASE}.apk"
          test -x "$apksigner"
          test -f "$apk"
          "$apksigner" verify --verbose "$apk"

      - name: Upload universal debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-standard-universal-debug-${{ steps.metadata.outputs.short_sha }}
          path: app/build/outputs/apk/standard/debug/app-standard-debug*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Build universal release APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleStandardRelease -PuniversalOnly=true --stacktrace --no-daemon --max-workers=2

      - name: Sign release APK
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -x "$apksigner"
          test -s release-key.pk8
          test -s release-cert.pem
          out_dir="app/build/outputs/apk/standard/release"
          source="$out_dir/app-standard-universal-release-unsigned.apk"
          signed="$out_dir/app-standard-universal-release-signed.apk"
          if [[ ! -f "$source" ]]; then
            source="$out_dir/app-standard-universal-release.apk"
          fi
          test -f "$source"
          "$apksigner" sign \
            --key release-key.pk8 \
            --cert release-cert.pem \
            --out "$signed" "$source"
          "$apksigner" verify --verbose --print-certs "$signed"


      - name: Verify release certificate
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          apk="app/build/outputs/apk/standard/release/app-standard-universal-release.apk"
          test -x "$apksigner"
          test -f "$apk"
          "$apksigner" verify --verbose --print-certs "$apk"

      - name: Upload universal release APK
        uses: actions/upload-artifact@v7
        with:
          name: app-standard-universal-release-${{ steps.metadata.outputs.short_sha }}
          path: app/build/outputs/apk/standard/release/app-standard-universal-release.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
