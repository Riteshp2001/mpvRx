name: CI/CD Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build universal APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APK_DIR: standard
      APK_BASE: app-standard-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # BuildConfig.GIT_COUNT and preview build identities rely on the real repository history.
          fetch-depth: 0

      - name: Generate build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short HEAD)"
          echo "SHORT_SHA=$short_sha" >> "$GITHUB_ENV"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build universal release APK
        shell: bash
        run: |
          set -euo pipefail
          # universalOnly disables ABI splits so a single APK carries every ABI.
          ./gradlew assembleStandardRelease -PuniversalOnly=true --stacktrace --no-daemon --max-workers=2

      - name: Sign APK when signing secrets are available
        shell: bash
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"

          test -x "$apksigner"

          if [[ -z "$SIGNING_KEYSTORE" ]]; then
            echo "SIGNING_KEYSTORE is unavailable (expected for untrusted fork PRs); keeping the CI APK unsigned."
            exit 0
          fi

          if [[ -z "$SIGNING_KEY_ALIAS" || -z "$SIGNING_STORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo "SIGNING_KEYSTORE exists but one or more required signing secrets are missing."
            exit 1
          fi

          # GitHub secrets may contain wrapped base64 or Windows line endings. Normalize
          # only whitespace, then fail with a useful message for a pasted binary/raw value.
          keystore_base64="$(printf '%s' "$SIGNING_KEYSTORE" | tr -d '[:space:]')"
          if [[ -z "$keystore_base64" || ! "$keystore_base64" =~ ^[A-Za-z0-9+/]*={0,2}$ || $(( ${#keystore_base64} % 4 )) -ne 0 ]]; then
            echo "SIGNING_KEYSTORE must be the complete base64 output of the .jks/.keystore file (not the binary file or a file path)."
            exit 1
          fi
          if ! printf '%s' "$keystore_base64" | base64 --decode > release.keystore; then
            echo "SIGNING_KEYSTORE is not valid base64. Re-encode the keystore and replace the GitHub secret."
            exit 1
          fi
          trap 'rm -f release.keystore' EXIT

          out_dir="app/build/outputs/apk/${APK_DIR}/release"
          signed="$out_dir/${APK_BASE}.apk"
          unsigned="$out_dir/${APK_BASE}-unsigned.apk"
          source=""
          if [[ -f "$unsigned" ]]; then
            source="$unsigned"
          elif [[ -f "$signed" ]]; then
            source="$signed"
          else
            echo "Missing expected APK: $unsigned (or $signed)"
            find app/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          fi

          staged="$out_dir/${APK_BASE}-signing.apk"
          rm -f "$staged"
          "$apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass "pass:$SIGNING_STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$staged" \
            "$source"
          "$apksigner" verify --verbose "$staged"
          rm -f "$unsigned"
          mv -f "$staged" "$signed"

      - name: Upload universal APK
        uses: actions/upload-artifact@v7
        with:
          name: app-standard-universal-release-${{ steps.metadata.outputs.short_sha }}
          path: app/build/outputs/apk/standard/release/app-standard-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
