name: Desktop Build

on:
  push:
    branches:
      - master
      - kmp-cross-platform
    paths:
      - 'shared/**'
      - 'desktopApp/**'
      - 'gradle/**'
      - 'scripts/fetch-libmpv-windows.ps1'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'shared/**'
      - 'desktopApp/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows MSI / EXE
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch libmpv
        shell: pwsh
        run: ./scripts/fetch-libmpv-windows.ps1 -WithYtDlp

      - name: Test
        run: ./gradlew :shared:core:desktopTest :desktopApp:test --console=plain

      - name: Package
        run: ./gradlew :desktopApp:packageReleaseMsi :desktopApp:packageReleaseExe --console=plain

      - uses: actions/upload-artifact@v7
        with:
          name: mpvRx-windows
          path: |
            desktopApp/build/compose/binaries/main-release/msi/*.msi
            desktopApp/build/compose/binaries/main-release/exe/*.exe
          if-no-files-found: error
