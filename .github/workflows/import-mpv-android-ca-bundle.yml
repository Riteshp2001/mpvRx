name: Import mpv-android CA bundle

on:
  push:
    branches:
      - fix/add-mpv-android-ca-bundle
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-ca-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/add-mpv-android-ca-bundle

      - name: Download and verify mpv-android CA bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/mpv-android/mpv-android/master/app/src/main/assets/cacert.pem \
            --output app/src/main/assets/cacert.pem
          echo "e57912808daef7b2b0fa4df2ccf17e47aeaf26c839a38f85c76003ebafd866bd  app/src/main/assets/cacert.pem" | sha256sum --check --strict

      - name: Commit imported bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/cacert.pem
          if git diff --cached --quiet; then
            echo "CA bundle already matches upstream"
            exit 0
          fi
          git commit -m "fix: add mpv-android CA bundle"
          git push origin HEAD:fix/add-mpv-android-ca-bundle
