name: Kodi CI/CD Build

# Builds the kodi distribution: mpvRx playing with the headless Kodi engine. Gradle downloads the
# engine AAR from KodiLibAndroid's kodi-v<mpvlibKodi> prerelease (gradle/libs.versions.toml).

on:
  push:
    branches: [kodi]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kodi-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/kodi'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      KODI_ABIS: universal arm64-v8a armeabi-v7a x86

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # BuildConfig.GIT_COUNT needs full history.
          fetch-depth: 0
          persist-credentials: false

      - name: Check the KodiLibAndroid release
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mpvlibKodi = "\(.*\)"$/\1/p' gradle/libs.versions.toml)"
          test -n "$version"
          release="https://github.com/Riteshp2001/kodilibandroid/releases/download/kodi-v${version}"
          checksum="$RUNNER_TEMP/kodi-aar.sha256"
          status="$(curl --silent --show-error --location --retry 3 \
            --write-out '%{http_code}' --output "$checksum" "$release/kodilibandroid-${version}.aar.sha256")"
          case "$status" in
            200) ;;
            404) curl --fail --silent --show-error --location --retry 3 \
              --output "$checksum" "$release/mpvlib-kodi-${version}.aar.sha256" ;;
            *) echo "::error::KodiLibAndroid ${version} checksum returned HTTP ${status}."; exit 1 ;;
          esac
          sha256="$(cut -d ' ' -f 1 "$checksum")"
          if [[ ! "$sha256" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Invalid SHA-256 for KodiLibAndroid ${version}."
            exit 1
          fi
          echo "MPVLIB_KODI_VERSION=$version" >> "$GITHUB_ENV"
          echo "MPVLIB_KODI_SHA256=$sha256" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install compile SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2"'

      - name: Build Kodi release APKs
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          # Packaging Kodi's libraries into four APKs needs more than the default 2 GB heap.
          ./gradlew :app:assembleKodiRelease --stacktrace --no-daemon --max-workers=2 \
            "-Dorg.gradle.jvmargs=-Xmx6g -Xms512m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8" \
            -PtargetAbi=arm64-v8a,armeabi-v7a,x86

      - name: Verify the engine in the APKs
        shell: bash
        run: |
          set -euo pipefail
          # The AAR Gradle resolved must be the published one.
          resolved="$(find ~/.gradle/caches/modules-2/files-2.1/app.gyrolet.mpvlib.kodi \
            \( -name "mpvlib-kodi-${MPVLIB_KODI_VERSION}.aar" \
              -o -name "kodilibandroid-${MPVLIB_KODI_VERSION}.aar" \) -print -quit)"
          test -n "$resolved"
          echo "${MPVLIB_KODI_SHA256}  ${resolved}" | sha256sum --check --strict

          out_dir=app/build/outputs/apk/kodi/release
          lib="$RUNNER_TEMP/libkodi.so"
          for abi in $KODI_ABIS; do
            base="app-kodi-$abi-release"
            apk="$out_dir/$base-unsigned.apk"
            [[ -f "$apk" ]] || apk="$out_dir/$base.apk"
            unzip -Z1 "$apk" assets/kodi/kodi-assets.zip > /dev/null
            native_abis="$abi"
            [[ "$abi" == universal ]] && native_abis="arm64-v8a armeabi-v7a x86"
            for native_abi in $native_abis; do
              unzip -Z1 "$apk" "lib/$native_abi/libkodiengine.so" > /dev/null
              unzip -p "$apk" "lib/$native_abi/libkodi.so" > "$lib"
              for marker in KODI_ENGINE_MODE Player.GetVideoSettings Player.GetChapters; do
                grep -aq "$marker" "$lib" ||
                  { echo "$apk: lib/$native_abi/libkodi.so lacks the engine patches ($marker)"; exit 1; }
              done
            done
          done
          rm -f "$lib"

      - name: Sign Kodi APKs
        shell: bash
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          out_dir=app/build/outputs/apk/kodi/release
          mkdir -p kodi-apks
          if [[ -z "$SIGNING_KEYSTORE" ]]; then
            echo "SIGNING_KEYSTORE is unavailable; uploading unsigned APKs."
            for abi in $KODI_ABIS; do
              cp "$out_dir/app-kodi-$abi-release"*.apk kodi-apks/
            done
            exit 0
          fi
          : "${SIGNING_KEY_ALIAS:?Missing signing alias}" \
            "${SIGNING_STORE_PASSWORD:?Missing signing store password}" \
            "${KEY_PASSWORD:?Missing signing key password}"
          keystore="$RUNNER_TEMP/kodi.keystore"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > "$keystore"
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -x "$apksigner"
          for abi in $KODI_ABIS; do
            base="app-kodi-$abi-release"
            apk="$out_dir/$base-unsigned.apk"
            [[ -f "$apk" ]] || apk="$out_dir/$base.apk"
            "$apksigner" sign --ks "$keystore" --ks-key-alias "$SIGNING_KEY_ALIAS" \
              --ks-pass env:SIGNING_STORE_PASSWORD --key-pass env:KEY_PASSWORD \
              --out "kodi-apks/mpvRx-kodi-$abi-release.apk" "$apk"
            "$apksigner" verify "kodi-apks/mpvRx-kodi-$abi-release.apk"
          done

      - name: Upload Kodi APKs
        uses: actions/upload-artifact@v7
        with:
          name: mpvRx-kodi-${{ github.sha }}
          path: kodi-apks/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
