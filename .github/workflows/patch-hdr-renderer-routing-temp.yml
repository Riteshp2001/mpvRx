name: Temporary HDR renderer routing patch

on:
  push:
    branches:
      - fix/flow-linear-hdr-output

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/flow-linear-hdr-output
          fetch-depth: 0

      - name: Route HDR Toys by renderer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          mpv_view = Path('app/src/main/java/app/gyrolet/mpvrx/ui/player/MPVView.kt')
          text = mpv_view.read_text()
          old_call = '    applyHdrToysMode(hdrScreenMode, hdrPipelineReady)'
          new_call = '    applyHdrToysMode(hdrScreenMode, hdrPipelineReady, legacyGpu = backend.vo == "gpu")'
          assert text.count(old_call) == 1, f'MPVView init call count={text.count(old_call)}'
          text = text.replace(old_call, new_call)

          old_sig = '''  fun applyHdrToysMode(\n    mode: HdrScreenMode,\n    pipelineReady: Boolean,\n  ) {'''
          new_sig = '''  fun applyHdrToysMode(\n    mode: HdrScreenMode,\n    pipelineReady: Boolean,\n    legacyGpu: Boolean,\n  ) {'''
          assert text.count(old_sig) == 1, f'MPVView signature count={text.count(old_sig)}'
          text = text.replace(old_sig, new_sig)

          old_apply = '    if (!hdrToysManager.apply(profile)) {'
          new_apply = '    if (!hdrToysManager.apply(profile, legacyGpu = legacyGpu)) {'
          assert text.count(old_apply) == 1, f'MPVView manager call count={text.count(old_apply)}'
          text = text.replace(old_apply, new_apply)
          mpv_view.write_text(text)

          vm = Path('app/src/main/java/app/gyrolet/mpvrx/ui/player/PlayerViewModel.kt')
          text = vm.read_text()
          old_apply = '    if (!hdrToysManager.apply(profile)) {'
          new_apply = '''    val legacyGpu = PlaybackSession.getPropertyString("vo") == "gpu"\n    if (!hdrToysManager.apply(profile, legacyGpu = legacyGpu)) {'''
          assert text.count(old_apply) == 1, f'PlayerViewModel manager call count={text.count(old_apply)}'
          text = text.replace(old_apply, new_apply)
          vm.write_text(text)
          PY

      - name: Commit renderer routing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/gyrolet/mpvrx/ui/player/MPVView.kt \
                  app/src/main/java/app/gyrolet/mpvrx/ui/player/PlayerViewModel.kt
          git diff --cached --check
          git commit -m "fix(hdr): route legacy gpu to v2 shader set"
          git push origin HEAD:fix/flow-linear-hdr-output
