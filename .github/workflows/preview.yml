name: Preview Build

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mpvrx-preview-pages
  cancel-in-progress: true

jobs:
  check:
    name: Resolve preview build decision
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.activity.outputs.should_build }}
      source_fingerprint: ${{ steps.activity.outputs.source_fingerprint }}
      selected_flavor: ${{ steps.activity.outputs.selected_flavor }}
      website_visible: ${{ steps.activity.outputs.website_visible }}
      publication_mode: ${{ steps.activity.outputs.publication_mode }}
      commit_count: ${{ steps.metadata.outputs.commit_count }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      commit_title: ${{ steps.metadata.outputs.commit_title }}
      published_at: ${{ steps.metadata.outputs.published_at }}

    steps:
      - name: Checkout preview source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for unpublished app activity
        id: activity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PREVIEW_MANIFEST_URL: https://riteshp2001.github.io/mpvRx/latest.json
        run: |
          set -euo pipefail

          source_fingerprint="$(
            git ls-files -s -- \
              app \
              build.gradle.kts \
              settings.gradle.kts \
              gradle.properties \
              gradle \
              fastlane/metadata/android/preview-site \
              fastlane/metadata/android/en-US/images/icon.png \
              | sha256sum | cut -d' ' -f1
          )"

          latest_fingerprint="$(
            curl -fsSL --retry 3 --retry-delay 2 "$PREVIEW_MANIFEST_URL" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin).get("source_fingerprint", ""))' \
              2>/dev/null || true
          )"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            should_build=true
            reason="manual request"
            selected_flavor=all
            website_visible=true
            publication_mode=manual
          elif [[ -z "$latest_fingerprint" ]]; then
            should_build=true
            reason="published manifest has no source fingerprint"
            selected_flavor=all
            website_visible=true
            publication_mode=automatic
          elif [[ "$source_fingerprint" != "$latest_fingerprint" ]]; then
            should_build=true
            reason="app source changed"
            selected_flavor=all
            website_visible=true
            publication_mode=automatic
          else
            should_build=false
            reason="no app activity since the latest preview"
            selected_flavor=all
            website_visible=true
            publication_mode=automatic
          fi

          {
            echo "should_build=$should_build"
            echo "source_fingerprint=$source_fingerprint"
            echo "selected_flavor=$selected_flavor"
            echo "website_visible=$website_visible"
            echo "publication_mode=$publication_mode"
          } >> "$GITHUB_OUTPUT"
          echo "Preview decision: $should_build ($reason)"

      - name: Set build metadata
        id: metadata
        if: steps.activity.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "commit_count=$(git rev-list --count HEAD)"
            echo "source_sha=$(git rev-parse HEAD)"
            echo "commit_title=$(git log -1 --format=%s)"
            echo "published_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.distribution.name }} preview APKs
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        distribution:
          - id: standard
            name: Standard
            gradle: Standard
            dir: standard
            abis: universal arm64-v8a armeabi-v7a x86 x86_64
            asset: ''
          - id: fongmi
            name: FongMi
            gradle: Fongmi
            dir: fongmi
            abis: universal
            asset: fongmi
          - id: no_vulkan
            name: No Vulkan
            gradle: NoVulkan
            dir: noVulkan
            abis: universal
            asset: no-vulkan
    env:
      COMMIT_COUNT: ${{ needs.check.outputs.commit_count }}
      GRADLE_FLAVOR: ${{ matrix.distribution.gradle }}
      APK_DIR: ${{ matrix.distribution.dir }}
      APK_ABIS: ${{ matrix.distribution.abis }}
      ASSET_NAME: ${{ matrix.distribution.asset }}

    steps:
      - name: Checkout preview source
        uses: actions/checkout@v7
        with:
          # BuildConfig.GIT_COUNT and the preview version code rely on the real repository history.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build preview APKs
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew "assemble${GRADLE_FLAVOR}Preview" --stacktrace --no-daemon --max-workers=2

      - name: Sign and stage preview APKs
        shell: bash
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"

          if [[ -z "$SIGNING_KEYSTORE" || -z "$SIGNING_KEY_ALIAS" || -z "$SIGNING_STORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo "Required signing secrets are missing; refusing to publish unsigned preview APKs."
            exit 1
          fi

          test -x "$apksigner"
          printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > release.keystore
          trap 'rm -f release.keystore' EXIT

          # AGP only appends "-unsigned" when the variant has no signing config, so accept
          # either name and always re-sign with the release key.
          sign_apk() {
            local dir="$1"
            local base="$2"
            local label="$3"
            local signed="$dir/$base.apk"
            local unsigned="$dir/$base-unsigned.apk"
            local source=""

            if [[ -f "$unsigned" ]]; then
              source="$unsigned"
            elif [[ -f "$signed" ]]; then
              source="$signed"
            else
              echo "Missing expected $label APK: $unsigned (or $signed)"
              find app/build/outputs/apk -type f -name '*.apk' -print || true
              exit 1
            fi

            local staged="$dir/$base-signing.apk"
            rm -f "$staged"
            "$apksigner" sign \
              --ks release.keystore \
              --ks-key-alias "$SIGNING_KEY_ALIAS" \
              --ks-pass "pass:$SIGNING_STORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "$staged" \
              "$source"
            "$apksigner" verify --verbose "$staged"
            rm -f "$unsigned"
            mv -f "$staged" "$signed"
          }

          out_dir="app/build/outputs/apk/${APK_DIR}/preview"
          test -d "$out_dir"
          mkdir -p downloads

          for abi in $APK_ABIS; do
            base="app-${APK_DIR}-${abi}-preview"
            sign_apk "$out_dir" "$base" "${APK_DIR} ${abi} preview"
            cp "$out_dir/$base.apk" "downloads/mpvRx-preview-r${COMMIT_COUNT}-${ASSET_NAME:-$abi}.apk"
          done

      - name: Upload preview APKs
        uses: actions/upload-artifact@v7
        with:
          name: preview-apks-${{ matrix.distribution.id }}
          path: downloads/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Stage preview download page
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMMIT_COUNT: ${{ needs.check.outputs.commit_count }}
      SOURCE_SHA: ${{ needs.check.outputs.source_sha }}
      COMMIT_TITLE: ${{ needs.check.outputs.commit_title }}
      PUBLISHED_AT: ${{ needs.check.outputs.published_at }}
      SOURCE_FINGERPRINT: ${{ needs.check.outputs.source_fingerprint }}
      SELECTED_FLAVOR: ${{ needs.check.outputs.selected_flavor }}
      WEBSITE_VISIBLE: ${{ needs.check.outputs.website_visible }}
      PUBLICATION_MODE: ${{ needs.check.outputs.publication_mode }}
      SOURCE_RUN_ID: ${{ github.run_id }}
      SOURCE_RUN_NUMBER: ${{ github.run_number }}
      SOURCE_RUN_URL: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
      SOURCE_BRANCH: ${{ github.ref_name }}

    steps:
      - name: Checkout preview source
        uses: actions/checkout@v7

      - name: Download preview APKs
        uses: actions/download-artifact@v8
        with:
          pattern: preview-apks-*
          merge-multiple: true
          path: site/downloads

      - name: Stage GitHub Pages preview site
        env:
          SITE_BASE_URL: https://riteshp2001.github.io/mpvRx
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/downloads
          cp fastlane/metadata/android/preview-site/index.html site/index.html
          cp fastlane/metadata/android/en-US/images/icon.png site/icon.png
          cp fastlane/metadata/android/preview-site/site.webmanifest site/site.webmanifest
          touch site/.nojekyll

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          site_dir = Path("site")
          downloads_dir = site_dir / "downloads"
          base_url = os.environ["SITE_BASE_URL"].rstrip("/")
          commit_count = int(os.environ["COMMIT_COUNT"])
          source_sha = os.environ["SOURCE_SHA"]
          commit_title = os.environ["COMMIT_TITLE"]
          published_at = os.environ["PUBLISHED_AT"]
          run_id = int(os.environ["SOURCE_RUN_ID"])
          run_number = int(os.environ["SOURCE_RUN_NUMBER"])
          run_url = os.environ["SOURCE_RUN_URL"]
          source_fingerprint = os.environ["SOURCE_FINGERPRINT"]
          selected_flavor = os.environ["SELECTED_FLAVOR"]
          website_visible = os.environ["WEBSITE_VISIBLE"].lower() == "true"
          publication_mode = os.environ["PUBLICATION_MODE"]

          public_names = [
              "universal",
              "arm64-v8a",
              "armeabi-v7a",
              "x86",
              "x86_64",
              "fongmi",
              "no-vulkan",
          ]
          assets = []

          for public_name in public_names:
              name = f"mpvRx-preview-r{commit_count}-{public_name}.apk"
              apk = downloads_dir / name
              if not apk.is_file():
                  raise SystemExit(f"Missing signed APK for {public_name}: {apk}")

              assets.append({
                  "abi": public_name,
                  "browser_download_url": f"{base_url}/downloads/{name}",
                  "name": name,
                  "size": apk.stat().st_size,
                  "content_type": "application/vnd.android.package-archive",
                  "sha256": hashlib.sha256(apk.read_bytes()).hexdigest(),
              })

          manifest = {
              "tag_name": f"preview-r{commit_count}",
              "name": f"mpvRx Preview r{commit_count}",
              "body": (
                  f"Commit: {commit_title}\n\n"
                  f"{publication_mode.title()} preview from workflow run #{run_number}. "
                  f"Source commit: {source_sha[:7]}."
              ),
              "published_at": published_at,
              "assets": assets,
              "channel": "preview",
              "commit_sha": source_sha,
              "commit_title": commit_title,
              "commit_count": commit_count,
              "source_fingerprint": source_fingerprint,
              "website_visible": website_visible,
              "publication_mode": publication_mode,
              "run_number": run_number,
              "run_id": run_id,
              "run_url": run_url,
              "source_branch": os.environ["SOURCE_BRANCH"],
              "source_workflow": "Preview Build",
              "selected_flavor": selected_flavor,
              "pages_url": base_url + "/",
          }

          (site_dir / "latest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          python3 -m json.tool site/latest.json >/dev/null
          find site -maxdepth 2 -type f -printf '%p %k KB\n' | sort

      - name: Upload preview manifest as Actions artifact
        uses: actions/upload-artifact@v7
        with:
          name: mpvRx-preview-r${{ needs.check.outputs.commit_count }}-manifest
          path: site/latest.json
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy-preview:
    name: Publish preview download page
    needs: [check, publish]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
