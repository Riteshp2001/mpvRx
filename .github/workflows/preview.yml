name: Preview Build

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mpvrx-preview-pages
  cancel-in-progress: true

jobs:
  build-preview:
    name: Build preview APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      should_build: ${{ steps.activity.outputs.should_build }}

    steps:
      - name: Checkout preview source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for unpublished app activity
        id: activity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PREVIEW_MANIFEST_URL: https://riteshp2001.github.io/mpvRx/latest.json
        run: |
          set -euo pipefail

          source_fingerprint="$(
            git ls-files -s -- \
              app \
              build.gradle.kts \
              settings.gradle.kts \
              gradle.properties \
              gradle \
              fastlane/metadata/android/preview-site \
              fastlane/metadata/android/en-US/images/icon.png \
              | sha256sum | cut -d' ' -f1
          )"

          latest_fingerprint="$(
            curl -fsSL --retry 3 --retry-delay 2 "$PREVIEW_MANIFEST_URL" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin).get("source_fingerprint", ""))' \
              2>/dev/null || true
          )"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            should_build=true
            reason="manual request"
            selected_flavor=all
            website_visible=true
            publication_mode=manual
          elif [[ -z "$latest_fingerprint" ]]; then
            should_build=true
            reason="published manifest has no source fingerprint"
            selected_flavor=all
            website_visible=true
            publication_mode=automatic
          elif [[ "$source_fingerprint" != "$latest_fingerprint" ]]; then
            should_build=true
            reason="app source changed"
            selected_flavor=all
            website_visible=true
            publication_mode=automatic
          else
            should_build=false
            reason="no app activity since the latest preview"
            selected_flavor=all
            website_visible=true
            publication_mode=automatic
          fi

          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "SOURCE_FINGERPRINT=$source_fingerprint" >> "$GITHUB_ENV"
          echo "SELECTED_FLAVOR=$selected_flavor" >> "$GITHUB_ENV"
          echo "WEBSITE_VISIBLE=$website_visible" >> "$GITHUB_ENV"
          echo "PUBLICATION_MODE=$publication_mode" >> "$GITHUB_ENV"
          echo "Preview decision: $should_build ($reason)"

      - name: Set build metadata
        id: metadata
        if: steps.activity.outputs.should_build == 'true'
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_NUMBER: ${{ github.run_number }}
          SOURCE_RUN_URL: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          commit_count="$(git rev-list --count HEAD)"
          source_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short HEAD)"
          published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          echo "COMMIT_COUNT=$commit_count" >> "$GITHUB_ENV"
          echo "commit_count=$commit_count" >> "$GITHUB_OUTPUT"
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$short_sha" >> "$GITHUB_ENV"
          echo "PUBLISHED_AT=$published_at" >> "$GITHUB_ENV"
          echo "SOURCE_RUN_ID=$SOURCE_RUN_ID" >> "$GITHUB_ENV"
          echo "SOURCE_RUN_NUMBER=$SOURCE_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "SOURCE_RUN_URL=$SOURCE_RUN_URL" >> "$GITHUB_ENV"
          echo "SOURCE_BRANCH=$SOURCE_BRANCH" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        if: steps.activity.outputs.should_build == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        if: steps.activity.outputs.should_build == 'true'
        run: chmod +x ./gradlew

      - name: Build selected preview APKs
        if: steps.activity.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleStandardPreview --stacktrace --no-daemon --max-workers=2
          if [[ "$SELECTED_FLAVOR" == "all" ]]; then
            ./gradlew assembleFongmiPreview --stacktrace --no-daemon --max-workers=2
            ./gradlew assembleNoVulkanPreview --stacktrace --no-daemon --max-workers=2
          fi

      - name: Sign and verify preview APKs
        if: steps.activity.outputs.should_build == 'true'
        shell: bash
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"

          if [[ -z "$SIGNING_KEYSTORE" || -z "$SIGNING_KEY_ALIAS" || -z "$SIGNING_STORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo "Required signing secrets are missing; refusing to publish unsigned preview APKs."
            exit 1
          fi

          test -x "$apksigner"
          printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > release.keystore
          trap 'rm -f release.keystore' EXIT

          # AGP only appends "-unsigned" when the variant has no signing config, so accept
          # either name and always re-sign with the release key.
          sign_apk() {
            local dir="$1"
            local base="$2"
            local label="$3"
            local signed="$dir/$base.apk"
            local unsigned="$dir/$base-unsigned.apk"
            local source=""

            if [[ -f "$unsigned" ]]; then
              source="$unsigned"
            elif [[ -f "$signed" ]]; then
              source="$signed"
            else
              echo "Missing expected $label APK: $unsigned (or $signed)"
              find app/build/outputs/apk -type f -name '*.apk' -print || true
              exit 1
            fi

            local staged="$dir/$base-signing.apk"
            rm -f "$staged"
            "$apksigner" sign \
              --ks release.keystore \
              --ks-key-alias "$SIGNING_KEY_ALIAS" \
              --ks-pass "pass:$SIGNING_STORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "$staged" \
              "$source"
            "$apksigner" verify --verbose "$staged"
            rm -f "$unsigned"
            mv -f "$staged" "$signed"
          }

          preview_dir="app/build/outputs/apk/standard/preview"
          test -d "$preview_dir"
          architectures=(universal arm64-v8a armeabi-v7a x86 x86_64)
          for abi in "${architectures[@]}"; do
            sign_apk "$preview_dir" "app-standard-${abi}-preview" "standard $abi preview"
          done

          if [[ "$SELECTED_FLAVOR" == "all" ]]; then
            flavor_dir="app/build/outputs/apk/fongmi/preview"
            test -d "$flavor_dir"
            sign_apk "$flavor_dir" "app-fongmi-universal-preview" "fongmi universal preview"

            flavor_dir="app/build/outputs/apk/noVulkan/preview"
            test -d "$flavor_dir"
            sign_apk "$flavor_dir" "app-noVulkan-universal-preview" "non-Vulkan universal preview"
          fi

      - name: Stage GitHub Pages preview site
        if: steps.activity.outputs.should_build == 'true'
        env:
          SITE_BASE_URL: https://riteshp2001.github.io/mpvRx
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/downloads
          cp fastlane/metadata/android/preview-site/index.html site/index.html
          cp fastlane/metadata/android/en-US/images/icon.png site/icon.png
          cp fastlane/metadata/android/preview-site/site.webmanifest site/site.webmanifest
          touch site/.nojekyll

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          site_dir = Path("site")
          downloads_dir = site_dir / "downloads"
          base_url = os.environ["SITE_BASE_URL"].rstrip("/")
          commit_count = int(os.environ["COMMIT_COUNT"])
          source_sha = os.environ["SOURCE_SHA"]
          published_at = os.environ["PUBLISHED_AT"]
          run_id = int(os.environ["SOURCE_RUN_ID"])
          run_number = int(os.environ["SOURCE_RUN_NUMBER"])
          run_url = os.environ["SOURCE_RUN_URL"]
          source_fingerprint = os.environ["SOURCE_FINGERPRINT"]
          selected_flavor = os.environ["SELECTED_FLAVOR"]
          website_visible = os.environ["WEBSITE_VISIBLE"].lower() == "true"
          publication_mode = os.environ["PUBLICATION_MODE"]

          builds = [
              ("standard", "universal", "universal"),
              ("standard", "arm64-v8a", "arm64-v8a"),
              ("standard", "armeabi-v7a", "armeabi-v7a"),
              ("standard", "x86", "x86"),
              ("standard", "x86_64", "x86_64"),
          ]
          if selected_flavor == "all":
              builds.extend([
                  ("fongmi", "universal", "fongmi"),
                  ("noVulkan", "universal", "no-vulkan"),
              ])
          assets = []

          for flavor, output, public_name in builds:
              source_dir = Path("app/build/outputs/apk") / flavor / "preview"
              source = source_dir / f"app-{flavor}-{output}-preview.apk"
              if not source.is_file():
                  raise SystemExit(f"Missing signed APK for {public_name}: {source}")

              name = f"mpvRx-preview-r{commit_count}-{public_name}.apk"
              destination = downloads_dir / name
              shutil.copy2(source, destination)

              assets.append({
                  "abi": public_name,
                  "browser_download_url": f"{base_url}/downloads/{name}",
                  "name": name,
                  "size": destination.stat().st_size,
                  "content_type": "application/vnd.android.package-archive",
                  "sha256": hashlib.sha256(destination.read_bytes()).hexdigest(),
              })

          manifest = {
              "tag_name": f"preview-r{commit_count}",
              "name": f"mpvRx Preview r{commit_count}",
              "body": (
                  f"{publication_mode.title()} preview from workflow run #{run_number}. "
                  f"Source commit: {source_sha[:7]}."
              ),
              "published_at": published_at,
              "assets": assets,
              "channel": "preview",
              "commit_sha": source_sha,
              "commit_count": commit_count,
              "source_fingerprint": source_fingerprint,
              "website_visible": website_visible,
              "publication_mode": publication_mode,
              "run_number": run_number,
              "run_id": run_id,
              "run_url": run_url,
              "source_branch": os.environ["SOURCE_BRANCH"],
              "source_workflow": "Preview Build",
              "selected_flavor": selected_flavor,
              "pages_url": base_url + "/",
          }

          (site_dir / "latest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          python3 -m json.tool site/latest.json >/dev/null
          find site -maxdepth 2 -type f -printf '%p %k KB\n' | sort

      - name: Upload preview APKs as Actions artifact
        if: steps.activity.outputs.should_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mpvRx-preview-r${{ steps.metadata.outputs.commit_count }}
          path: |
            site/downloads/*.apk
            site/latest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Configure GitHub Pages
        if: steps.activity.outputs.should_build == 'true'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: steps.activity.outputs.should_build == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy-preview:
    name: Publish preview download page
    needs: build-preview
    if: needs.build-preview.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
