name: Make release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Tag to release (for example v2.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: mpvrx-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version_tag: ${{ steps.tag.outputs.version_tag }}

    steps:
      - name: Resolve and validate release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version_tag="${GITHUB_REF#refs/tags/}"
          else
            version_tag="$INPUT_TAG"
          fi

          if [[ ! "$version_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid stable release tag: $version_tag"
            exit 1
          fi
          echo "version_tag=$version_tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.distribution.name }} release APKs
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        distribution:
          - id: standard
            name: Standard
            gradle: Standard
            dir: standard
            abis: universal arm64-v8a armeabi-v7a x86 x86_64
            asset: ''
          - id: fongmi
            name: FongMi
            gradle: Fongmi
            dir: fongmi
            abis: universal
            asset: fongmi
          - id: no_vulkan
            name: No Vulkan
            gradle: NoVulkan
            dir: noVulkan
            abis: universal
            asset: no-vulkan
    env:
      VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
      GRADLE_FLAVOR: ${{ matrix.distribution.gradle }}
      APK_DIR: ${{ matrix.distribution.dir }}
      APK_ABIS: ${{ matrix.distribution.abis }}
      ASSET_NAME: ${{ matrix.distribution.asset }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APKs
        shell: bash
        run: |
          set -euo pipefail
          # Debug variants are automatically signed by AGP with the standard debug key.
          ./gradlew "assemble${GRADLE_FLAVOR}Debug" --stacktrace --no-daemon --max-workers=2

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: debug-assets-${{ matrix.distribution.id }}
          path: app/build/outputs/apk/${{ matrix.distribution.dir }}/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Build release APKs
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew "assemble${GRADLE_FLAVOR}Release" --stacktrace --no-daemon --max-workers=2

      - name: Verify and stage release APKs
        shell: bash
        run: |
          set -euo pipefail

          out_dir="app/build/outputs/apk/${APK_DIR}/release"
          test -d "$out_dir"
          mkdir -p release-assets

          for abi in $APK_ABIS; do
            base="app-${APK_DIR}-${abi}-release"
            apk="$out_dir/$base.apk"

            if [[ ! -f "$apk" ]]; then
              echo "Missing expected $APK_DIR $abi release APK: $apk"
              find app/build/outputs/apk -type f -name '*.apk' -print || true
              exit 1
            fi

            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$apk"
            cp "$apk" "release-assets/mpvRx-${ASSET_NAME:-$abi}-${VERSION_TAG}.apk"
          done
)
          for variant in "${variants[@]}"; do
            asset="release-assets/mpvRx-${variant}-${VERSION_TAG}.apk"
            if [[ ! -f "$asset" ]]; then
              echo "Missing expected release asset: $asset"
              find release-assets -type f -name '*.apk' -print || true
              exit 1
            fi
            sha256sum "$asset" | tee -a checksums.txt
          done

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8').splitlines()
          section = []
          in_latest = False
          for line in changelog:
              if line.startswith('## '):
                  if in_latest:
                      break
                  in_latest = True
              if in_latest:
                  section.append(line)

          latest = '\n'.join(section).strip()
          if not latest:
              raise SystemExit('Could not find latest changelog section')
          variant_guide = """
          ### APK variants

          All variants contain the same mpvRx app version and features, with their native backends built from [mpvlib Android](https://github.com/Riteshp2001/mpvlibAndroid). Choose the package that best matches your device:

          - **Standard** (`mpvRx-<architecture>-<version>.apk`): Recommended for most devices. Available as Universal and architecture-specific APKs with the standard Vulkan-capable playback backend.
          - **FongMi** (`mpvRx-fongmi-<version>.apk`): Universal package using the FongMi native profile for Vulkan, direct MediaCodec, and Dolby Vision playback.
          - **Non-Vulkan** (`mpvRx-no-vulkan-<version>.apk`): Universal OpenGL-only package for devices without compatible Vulkan support or with unstable legacy GPU drivers.
          """.strip()
          Path('release-notes.md').write_text(
              latest + '\n\n---\n' + variant_guide + '\n\n### SHA-256 checksums\n\n```text\n',
              encoding='utf-8',
          )
          PY
          cat checksums.txt >> release-notes.md
          printf '%s\n' '```' >> release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.version_tag }}
          name: mpvRx ${{ needs.prepare.outputs.version_tag }}
          body_path: release-notes.md
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
