name: Materialize isolated content-fd ThumbFast ViewModel

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scratch/thumbfast-content-fd
          fetch-depth: 0

      - name: Apply independent content descriptor routing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/app/gyrolet/mpvrx/ui/player/PlayerViewModel.kt')
          text = path.read_text()

          def replace_or_verify(old: str, new: str, label: str):
              global text
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f'{label}: old form matched {text.count(old)} times')
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'{label}: neither old nor new form found')

          replace_or_verify(
              '  private val thumbFastPreviewController = ThumbFastPreviewController(viewModelScope)\n',
              '  private val thumbFastPreviewController = ThumbFastPreviewController(viewModelScope, appContext)\n',
              'controller context',
          )

          replace_or_verify(
          '''    val source = resolveSeekThumbnailSource()
              val userAgent = runCatching { PlaybackSession.getPropertyString("user-agent") }.getOrNull()
          ''',
          '''    val source = resolveSeekThumbnailSource()
              val contentUri = resolveSeekThumbnailContentUri()
              val userAgent = runCatching { PlaybackSession.getPropertyString("user-agent") }.getOrNull()
          ''',
              'content uri lookup',
          )

          replace_or_verify(
          '''    thumbFastPreviewController.request(
                source = source,
                positionSeconds = positionSeconds,
          ''',
          '''    thumbFastPreviewController.request(
                source = source,
                contentUri = contentUri,
                positionSeconds = positionSeconds,
          ''',
              'content uri request',
          )

          replace_or_verify(
          '''  private fun resolveSeekThumbnailSource(): String? =
              // Prefer mpv's actual opened source. Network-library playback can replace a logical URI with
              // an authenticated loopback/range URL, and the secondary preview core must open that same URL.
              runCatching { PlaybackSession.getPropertyString("stream-open-filename") }.getOrNull()?.takeIf { it.isNotBlank() }
                ?: runCatching { PlaybackSession.getPropertyString("path") }.getOrNull()?.takeIf { it.isNotBlank() }
                ?: host.currentThumbnailSource()?.takeIf { it.isNotBlank() }

          ''',
          '''  private fun resolveSeekThumbnailSource(): String? =
              // Prefer mpv's actual opened source. Network-library playback can replace a logical URI with
              // an authenticated loopback/range URL, and the secondary preview core must open that same URL.
              runCatching { PlaybackSession.getPropertyString("stream-open-filename") }.getOrNull()?.takeIf { it.isNotBlank() }
                ?: runCatching { PlaybackSession.getPropertyString("path") }.getOrNull()?.takeIf { it.isNotBlank() }
                ?: host.currentThumbnailSource()?.takeIf { it.isNotBlank() }

            private fun resolveSeekThumbnailContentUri(): String? =
              PlaybackSession.queue.value.currentItem?.let { item ->
                sequenceOf(item.playableUri, item.originalUri)
                  .firstOrNull { candidate ->
                    runCatching { Uri.parse(candidate).scheme.equals("content", ignoreCase = true) }.getOrDefault(false)
                  }
              }

          ''',
              'content uri helper',
          )

          path.write_text(text)
          PY

          git diff --check
          grep -F 'ThumbFastPreviewController(viewModelScope, appContext)' app/src/main/java/app/gyrolet/mpvrx/ui/player/PlayerViewModel.kt
          grep -F 'contentUri = contentUri' app/src/main/java/app/gyrolet/mpvrx/ui/player/PlayerViewModel.kt
          grep -F 'PlaybackSession.queue.value.currentItem' app/src/main/java/app/gyrolet/mpvrx/ui/player/PlayerViewModel.kt

      - name: Commit materialized ViewModel blob
        shell: bash
        run: |
          if git diff --quiet -- app/src/main/java/app/gyrolet/mpvrx/ui/player/PlayerViewModel.kt; then
            echo "ViewModel already materialized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/gyrolet/mpvrx/ui/player/PlayerViewModel.kt
          git commit -m "scratch: isolate ThumbFast content descriptor"
          git push origin HEAD:scratch/thumbfast-content-fd
