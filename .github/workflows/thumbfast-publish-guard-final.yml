name: Normalize final ThumbFast native formatting

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scratch/thumbfast-publish-guard-final
          fetch-depth: 0

      - name: Format native source
        shell: bash
        run: |
          if ! command -v clang-format >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq clang-format
          fi
          clang-format -i app/src/main/cpp/thumbfast_preview.cpp
          git diff --check
          grep -F 'frame_pixels_ = std::move(pixels)' app/src/main/cpp/thumbfast_preview.cpp
          grep -F 'std::lock_guard<std::mutex> request_lock(request_mutex_)' app/src/main/cpp/thumbfast_preview.cpp

      - name: Commit normalized native blob
        shell: bash
        run: |
          if git diff --quiet -- app/src/main/cpp/thumbfast_preview.cpp; then
            echo "already normalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/cpp/thumbfast_preview.cpp
          git commit -m "scratch: normalize ThumbFast native source"
          git push origin HEAD:scratch/thumbfast-publish-guard-final
