name: Materialize newest-target ThumbFast publication guard

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scratch/thumbfast-render-thread
          fetch-depth: 0

      - name: Guard frame publication by current generation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/cpp/thumbfast_preview.cpp')
          text = path.read_text()
          old = '''      {
                std::lock_guard<std::mutex> lock(frame_mutex_);
                frame_pixels_.resize(static_cast<size_t>(width * height));
                for (int y = 0; y < height; ++y) {
                  const uint8_t* row = bytes + static_cast<size_t>(y) * stride;
                  for (int x = 0; x < width; ++x) {
                    const uint8_t b = row[x * 4 + 0];
                    const uint8_t g = row[x * 4 + 1];
                    const uint8_t r = row[x * 4 + 2];
                    frame_pixels_[static_cast<size_t>(y * width + x)] =
                        static_cast<jint>(0xFF000000u | (static_cast<uint32_t>(r) << 16) |
                                          (static_cast<uint32_t>(g) << 8) | static_cast<uint32_t>(b));
                  }
                }
                frame_width_ = width;
                frame_height_ = height;
                frame_source_epoch_ = request.source_epoch;
                ++frame_serial_;
              }
              rendered_generation_.store(request.generation);
              frame_cv_.notify_all();
              request_cv_.notify_all();
          '''
          new = '''      std::vector<jint> pixels(static_cast<size_t>(width * height));
              for (int y = 0; y < height; ++y) {
                const uint8_t* row = bytes + static_cast<size_t>(y) * stride;
                for (int x = 0; x < width; ++x) {
                  const uint8_t b = row[x * 4 + 0];
                  const uint8_t g = row[x * 4 + 1];
                  const uint8_t r = row[x * 4 + 2];
                  pixels[static_cast<size_t>(y * width + x)] =
                      static_cast<jint>(0xFF000000u | (static_cast<uint32_t>(r) << 16) |
                                        (static_cast<uint32_t>(g) << 8) | static_cast<uint32_t>(b));
                }
              }

              // Serialize the final publication with request generation updates. A newer pointer
              // target can arrive while BGR0 is being converted; such an older frame must never
              // become the visible ThumbFast bitmap after the newer request already won.
              {
                std::lock_guard<std::mutex> request_lock(request_mutex_);
                if (stop_.load() || !active_ || generation_ != request.generation ||
                    current_source_epoch_.load() != request.source_epoch) {
                  continue;
                }
                std::lock_guard<std::mutex> frame_lock(frame_mutex_);
                frame_pixels_ = std::move(pixels);
                frame_width_ = width;
                frame_height_ = height;
                frame_source_epoch_ = request.source_epoch;
                ++frame_serial_;
                rendered_generation_.store(request.generation);
              }
              frame_cv_.notify_all();
              request_cv_.notify_all();
          '''
          if text.count(old) != 1:
              raise SystemExit(f'publication block: expected 1 match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          grep -F 'generation_ != request.generation' app/src/main/cpp/thumbfast_preview.cpp
          grep -F 'frame_pixels_ = std::move(pixels)' app/src/main/cpp/thumbfast_preview.cpp

      - name: Commit materialized native blob
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/cpp/thumbfast_preview.cpp
          git commit -m "scratch: guard ThumbFast frame publication"
          git push origin HEAD:scratch/thumbfast-render-thread
