name: Normalize final ThumbFast source cache

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scratch/thumbfast-source-cache-final
          fetch-depth: 0

      - name: Normalize source-cache block
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/app/gyrolet/mpvrx/ui/player/PlayerViewModel.kt')
          text = path.read_text()
          function_start = text.index('  fun updateSeekThumbnailPreview(\n')
          start = text.index('    val sourceContext =\n', function_start)
          end = text.index('  fun lockControls() {\n', start)

          s2, s4, s6, s8, s10 = '  ', '    ', '      ', '        ', '          '
          lines = [
            f'{s4}val sourceContext =',
            f'{s6}seekThumbnailSourceContext ?: resolveSeekThumbnailSourceContext().also {{ resolved ->',
            f'{s8}if (resolved.source != null) seekThumbnailSourceContext = resolved',
            f'{s6}}}',
            '',
            f'{s4}thumbFastPreviewController.request(',
            f'{s6}source = sourceContext.source,',
            f'{s6}contentUri = sourceContext.contentUri,',
            f'{s6}positionSeconds = positionSeconds,',
            f'{s6}durationSeconds = durationSeconds,',
            f'{s6}userAgent = sourceContext.userAgent,',
            f'{s6}httpHeaders = sourceContext.httpHeaders,',
            f'{s4})',
            f'{s2}}}',
            '',
            f'{s2}fun hideSeekThumbnailPreview() {{',
            f'{s4}thumbFastPreviewController.clear()',
            f'{s2}}}',
            '',
            f'{s2}private fun resolveSeekThumbnailSourceContext(): SeekThumbnailSourceContext {{',
            f'{s4}val source =',
            f'{s6}// Prefer mpv\'s actual opened source. Network-library playback can replace a logical URI with',
            f'{s6}// an authenticated loopback/range URL, and the secondary preview core must open that same URL.',
            f'{s6}runCatching {{ PlaybackSession.getPropertyString("stream-open-filename") }}.getOrNull()?.takeIf {{ it.isNotBlank() }}',
            f'{s8}?: runCatching {{ PlaybackSession.getPropertyString("path") }}.getOrNull()?.takeIf {{ it.isNotBlank() }}',
            f'{s8}?: host.currentThumbnailSource()?.takeIf {{ it.isNotBlank() }}',
            f'{s4}val contentUri =',
            f'{s6}PlaybackSession.queue.value.currentItem?.let {{ item ->',
            f'{s8}sequenceOf(item.playableUri, item.originalUri)',
            f'{s10}.firstOrNull {{ candidate ->',
            f'{s10}  runCatching {{ Uri.parse(candidate).scheme.equals("content", ignoreCase = true) }}.getOrDefault(false)',
            f'{s10}}}',
            f'{s6}}}',
            f'{s4}return SeekThumbnailSourceContext(',
            f'{s6}source = source,',
            f'{s6}contentUri = contentUri,',
            f'{s6}userAgent = runCatching {{ PlaybackSession.getPropertyString("user-agent") }}.getOrNull(),',
            f'{s6}httpHeaders = runCatching {{ PlaybackSession.getPropertyString("http-header-fields") }}.getOrNull(),',
            f'{s4})',
            f'{s2}}}',
            '',
          ]
          desired = '\n'.join(lines) + '\n'
          path.write_text(text[:start] + desired + text[end:])
          PY

          git diff --check
          test "$(grep -c 'private fun resolveSeekThumbnailSourceContext' app/src/main/java/app/gyrolet/mpvrx/ui/player/PlayerViewModel.kt)" = 1

      - name: Commit normalized ViewModel blob
        shell: bash
        run: |
          if git diff --quiet -- app/src/main/java/app/gyrolet/mpvrx/ui/player/PlayerViewModel.kt; then
            echo "already normalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/gyrolet/mpvrx/ui/player/PlayerViewModel.kt
          git commit -m "scratch: normalize ThumbFast source cache"
          git push origin HEAD:scratch/thumbfast-source-cache-final
